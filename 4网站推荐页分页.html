            title: "穿越时空的爱恋",
            author: "樱花树下",
            views: "1.5k",
            rating: 4.9,
            image: "图片/5.jpg",
            tags: ["言情", "奇幻"],
            content: `
                <p>考古学家林小雨小心翼翼地清理着刚出土的文物，这是一枚造型奇特的古戒，上面刻着神秘的符文。</p>
                <p>"这可能是重大发现！"她兴奋地戴上手套想取下戒指，却不小心被戒指边缘划破了手指。</p>
                <p>鲜血滴在戒指上的一瞬间，符文突然亮起蓝光。林小雨感到一阵眩晕，周围的景象开始扭曲...</p>
                <p>当她再次睁开眼睛时，发现自己正站在一座古代宫殿中，身上穿着华丽的古装。</p>
                <p>"公主殿下，您怎么在这里？婚礼马上就要开始了！"一个侍女匆忙跑来...</p>
                <p>林小雨震惊地看着自己的双手，这枚戒指竟然将她带回到了千年前的大唐盛世！</p>
                <p>更令她惊讶的是，镜中的自己，竟然与历史上那位早逝的平阳公主长得一模一样...</p>
            `
        }
    ];

    document.addEventListener('DOMContentLoaded', function() {
        // 获取DOM元素
        const storyCards = document.querySelectorAll('.story-card');
        const storyModal = document.getElementById('story-modal');
        const closeStoryModal = document.getElementById('close-story-modal');
        const modalTitle = document.getElementById('story-modal-title');
        const modalAuthor = document.getElementById('story-modal-author');
        const modalViews = document.getElementById('story-modal-views');
        const modalRating = document.getElementById('story-modal-rating');
        const modalImage = document.getElementById('story-modal-image');
        const modalTags = document.getElementById('story-modal-tags');
        const modalContent = document.getElementById('story-modal-content');
        
        // 为每个故事卡片添加点击事件
        storyCards.forEach(card => {
            card.addEventListener('click', function() {
                const storyId = parseInt(this.getAttribute('data-id'));
                const story = stories.find(s => s.id === storyId);
                
                if (story) {
                    // 填充模态框内容
                    modalTitle.textContent = story.title;
                    modalAuthor.textContent = story.author;
                    modalViews.textContent = story.views;
                    modalRating.textContent = story.rating;
                    modalImage.src = story.image;
                    
                    // 清空并重新添加标签
                    modalTags.innerHTML = '';
                    story.tags.forEach(tag => {
                        const tagElement = document.createElement('span');
                        tagElement.className = 'text-xs px-2 py-1 bg-gray-100 text-gray-700 rounded-full';
                        tagElement.textContent = tag;
                        modalTags.appendChild(tagElement);
                    });
                    
                    // 添加故事内容
                    modalContent.innerHTML = story.content;
                    
                    // 显示模态框
                    storyModal.classList.remove('hidden');
                    document.body.style.overflow = 'hidden';
                }
            });
        });
        
        // 关闭模态框
        closeStoryModal.addEventListener('click', function() {
            storyModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        });
        
        // 点击模态框外部关闭
        storyModal.addEventListener('click', function(e) {
            if (e.target === storyModal) {
                storyModal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        });
    });

        // 模拟用户数据库（存储在localStorage中）
        let users = JSON.parse(localStorage.getItem('users')) || {};
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化导航栏滚动效果
            window.addEventListener('scroll', function() {
                const navbar = document.getElementById('navbar');
                if (window.scrollY > 50) {
                    navbar.classList.add('py-2');
                    navbar.classList.add('shadow-md');
                } else {
                    navbar.classList.remove('py-2');
                    navbar.classList.remove('shadow-md');
                }
            });

            // 初始化移动端菜单
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            
            mobileMenuBtn.addEventListener('click', function() {
                mobileMenu.classList.toggle('hidden');
            });

            // 初始化搜索功能
            initSearch();

            // 初始化登录/注册功能
            initAuth();

            // 初始化用户状态
            updateUserStatus();

            // 初始化书签功能
            initBookmark();

            // 初始化关注作者功能
            initFollowAuthor();

            // 初始化订阅功能
            initSubscription();
        });

        // 搜索功能初始化
        function initSearch() {
             const searchToggle = document.getElementById('search-toggle');
            const searchBar = document.getElementById('search-bar');
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            const resultsContainer = document.getElementById('results-container');

            // 切换搜索框显示/隐藏
            searchToggle.addEventListener('click', function(e) {
        e.stopPropagation(); // 阻止事件冒泡
        isSearchBarVisible = !searchBar.classList.toggle('hidden');
        
        if (isSearchBarVisible) {
            searchInput.focus();
        }
    });

            // 搜索输入处理
            searchInput.addEventListener('input', function(e) {
                const query = e.target.value.trim().toLowerCase();
                if (query.length < 2) {
                    searchResults.classList.add('hidden');
                    return;
                }

                // 模拟搜索结果
                const matchedStories = stories.filter(story => 
                    story.title.toLowerCase().includes(query) || 
                    story.author.toLowerCase().includes(query) ||
                    story.category.toLowerCase().includes(query)
                );

                // 显示搜索结果
                resultsContainer.innerHTML = '';
                if (matchedStories.length > 0) {
                    matchedStories.forEach(story => {
                        const resultItem = document.createElement('div');
                        resultItem.className = 'flex items-center p-2 hover:bg-neutral-100 rounded-lg transition-colors';
                        resultItem.innerHTML = `
                            <img src="${story.image}" alt="${story.title}" class="w-12 h-12 object-cover rounded mr-3">
                            <div class="flex-1">
                                <div class="font-medium">${story.title}</div>
                                <div class="text-sm text-neutral-500">${story.author} · ${story.category}</div>
                            </div>
                            <span class="text-xs text-neutral-500">${story.rating} <i class="fa fa-star"></i></span>
                        `;
                        resultsContainer.appendChild(resultItem);
                    });
                    searchResults.classList.remove('hidden');
                } else {
                    resultsContainer.innerHTML = '<div class="text-center py-3 text-neutral-500">没有找到相关结果</div>';
                    searchResults.classList.remove('hidden');
                }
            });

            // 点击页面其他区域关闭搜索框
            document.addEventListener('click', function(e) {
               // 只有当搜索框可见且点击的不是搜索框内部元素时才关闭
        if (isSearchBarVisible && !searchBar.contains(e.target)) {
            searchBar.classList.add('hidden');
            isSearchBarVisible = false;
        }
            });
             // 点击搜索框内部时阻止事件冒泡
    searchBar.addEventListener('click', function(e) {
        e.stopPropagation();
    });
        }

        // 初始化登录/注册功能
        function initAuth() {
            const authModal = document.getElementById('auth-modal');
            const loginBtn = document.getElementById('login-btn');
            const registerBtn = document.getElementById('register-btn');
            const mobileLoginBtn = document.getElementById('mobile-login-btn');
            const mobileRegisterBtn = document.getElementById('mobile-register-btn');
            const closeModal = document.getElementById('close-modal');
            const switchToRegister = document.getElementById('switch-to-register');
            const switchToLogin = document.getElementById('switch-to-login');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginFormContainer = document.getElementById('login-form-container');
            const registerFormContainer = document.getElementById('register-form-container');
            const modalTitle = document.getElementById('modal-title');
            const logoutBtn = document.getElementById('logout-btn');
            const mobileLogoutBtn = document.getElementById('mobile-logout-btn');

            // 打开登录模态框
            function openLoginModal() {
                modalTitle.textContent = '登录';
                loginFormContainer.classList.remove('hidden');
                registerFormContainer.classList.add('hidden');
                authModal.classList.remove('hidden');
                // 添加模态框显示动画
                setTimeout(() => {
                    authModal.querySelector('div').classList.add('scale-100');
                    authModal.querySelector('div').classList.remove('scale-95');
                }, 10);
            }

            // 打开注册模态框
            function openRegisterModal() {
                modalTitle.textContent = '注册';
                loginFormContainer.classList.add('hidden');
                registerFormContainer.classList.remove('hidden');
                authModal.classList.remove('hidden');
                // 添加模态框显示动画
                setTimeout(() => {
                    authModal.querySelector('div').classList.add('scale-100');
                    authModal.querySelector('div').classList.remove('scale-95');
                }, 10);
            }

            // 关闭模态框
            function closeModalFunc() {
                authModal.querySelector('div').classList.remove('scale-100');
                authModal.querySelector('div').classList.add('scale-95');
                setTimeout(() => {
                    authModal.classList.add('hidden');
                }, 200);
            }

            // 绑定登录/注册按钮事件
            loginBtn.addEventListener('click', openLoginModal);
            registerBtn.addEventListener('click', openRegisterModal);
            mobileLoginBtn.addEventListener('click', openLoginModal);
            mobileRegisterBtn.addEventListener('click', openRegisterModal);
            closeModal.addEventListener('click', closeModalFunc);
            switchToRegister.addEventListener('click', openRegisterModal);
            switchToLogin.addEventListener('click', openLoginModal);

            // 点击模态框外部关闭
            authModal.addEventListener('click', function(e) {
                if (e.target === authModal) {
                    closeModalFunc();
                }
            });

            // 登录表单提交
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                if (!email || !password) {
                    alert('请输入邮箱和密码');
                    return;
                }

                // 验证用户
                if (users[email] && users[email].password === password) {
                    currentUser = {
                        email: email,
                        username: users[email].username,
                        avatar: users[email].avatar
                    };
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    updateUserStatus();
                    closeModalFunc();
                    alert('登录成功！');
                } else {
                    alert('邮箱或密码错误');
                }
            });

            // 注册表单提交
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('register-username').value;
                const email = document.getElementById('register-email').value;
                const password = document.getElementById('register-password').value;
                const confirmPassword = document.getElementById('register-confirm-password').value;

                if (!username || !email || !password) {
                    alert('请填写所有必填字段');
                    return;
                }

                if (password !== confirmPassword) {
                    alert('两次输入的密码不一致');
                    return;
                }

                // 检查邮箱是否已注册
                if (users[email]) {
                    alert('该邮箱已被注册');
                    return;
                }

                // 创建新用户
                users[email] = {
                    username: username,
                    password: password,
                    avatar: `https://picsum.photos/200/200?user${Object.keys(users).length + 1}`,
                    bookmarks: [],
                    following: []
                };

                localStorage.setItem('users', JSON.stringify(users));

                // 自动登录
                currentUser = {
                    email: email,
                    username: username,
                    avatar: users[email].avatar
                };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                updateUserStatus();
                closeModalFunc();
                alert('注册成功！');
            });

            // 注销
            logoutBtn.addEventListener('click', function() {
                currentUser = null;
                localStorage.removeItem('currentUser');
                updateUserStatus();
            });

            mobileLogoutBtn.addEventListener('click', function() {
                currentUser = null;
                localStorage.removeItem('currentUser');
                updateUserStatus();
                mobileMenu.classList.add('hidden');
            });
        }

        // 更新用户状态显示
        function updateUserStatus() {
            const loggedIn = document.getElementById('logged-in');
            const loginRegister = document.getElementById('login-register');
            const mobileLoggedIn = document.getElementById('mobile-logged-in');
            const mobileLoginRegister = document.getElementById('mobile-login-register');
            const usernameDisplay = document.getElementById('username-display');
            const userAvatar = document.getElementById('user-avatar');
            const mobileUsername = document.getElementById('mobile-username');
            const mobileUserAvatar = document.getElementById('mobile-user-avatar');

            if (currentUser) {
                // 用户已登录
                loggedIn.classList.remove('hidden');
                loginRegister.classList.add('hidden');
                mobileLoggedIn.classList.remove('hidden');
                mobileLoginRegister.classList.add('hidden');
                
                usernameDisplay.textContent = currentUser.username;
                userAvatar.src = currentUser.avatar;
                mobileUsername.textContent = currentUser.username;
                mobileUserAvatar.src = currentUser.avatar;
                
                // 更新书签状态
                updateBookmarkStatus();
                
                // 更新关注状态
                updateFollowStatus();
            } else {
                // 用户未登录
                loggedIn.classList.add('hidden');
                loginRegister.classList.remove('hidden');
                mobileLoggedIn.classList.add('hidden');
                mobileLoginRegister.classList.remove('hidden');
            }
        }

        // 初始化书签功能
        function initBookmark() {
            document.querySelectorAll('.add-to-bookmark').forEach(button => {
                button.addEventListener('click', function() {
                    if (!currentUser) {
                        alert('请先登录');
                        return;
                    }
                    
                    const storyId = parseInt(this.getAttribute('data-id'));
                    const isBookmarked = this.classList.contains('text-accent');
                    
                    if (isBookmarked) {
                        // 移除书签
                        users[currentUser.email].bookmarks = users[currentUser.email].bookmarks.filter(id => id !== storyId);
                        this.classList.remove('text-accent');
                        this.classList.add('text-secondary');
                        this.innerHTML = '<i class="fa fa-bookmark-o"></i>';
                        alert('已从书签中移除');
                    } else {
                        // 添加书签
                        users[currentUser.email].bookmarks.push(storyId);
                        this.classList.remove('text-secondary');
                        this.classList.add('text-accent');
                        this.innerHTML = '<i class="fa fa-bookmark"></i>';
                        alert('已添加到书签');
                    }
                    
                    localStorage.setItem('users', JSON.stringify(users));
                });
            });
        }

        // 更新书签状态
        function updateBookmarkStatus() {
            if (!currentUser) return;
            
            const userBookmarks = users[currentUser.email].bookmarks || [];
            
            document.querySelectorAll('.add-to-bookmark').forEach(button => {
                const storyId = parseInt(button.getAttribute('data-id'));
                
                if (userBookmarks.includes(storyId)) {
                    button.classList.remove('text-secondary');
                    button.classList.add('text-accent');
                    button.innerHTML = '<i class="fa fa-bookmark"></i>';
                } else {
                    button.classList.remove('text-accent');
                    button.classList.add('text-secondary');
                    button.innerHTML = '<i class="fa fa-bookmark-o"></i>';
                }
            });
        }

        // 初始化关注作者功能
        function initFollowAuthor() {
            document.querySelectorAll('.follow-author').forEach(button => {
                button.addEventListener('click', function() {
                    if (!currentUser) {
                        alert('请先登录');
                        return;
                    }
                    
                    const authorId = parseInt(this.getAttribute('data-id'));
                    const isFollowing = this.textContent.trim() === '已关注';
                    
                    if (isFollowing) {
                        // 取消关注
                        users[currentUser.email].following = users[currentUser.email].following.filter(id => id !== authorId);
                        this.textContent = '关注作者';
                        this.classList.remove('bg-secondary', 'text-white');
                        this.classList.add('border', 'border-secondary', 'text-secondary');
                        alert('已取消关注');
                    } else {
                        // 关注作者
                        users[currentUser.email].following.push(authorId);
                        this.textContent = '已关注';
                        this.classList.remove('border', 'border-secondary', 'text-secondary');
                        this.classList.add('bg-secondary', 'text-white');
                        alert('已关注该作者');
                    }
                    
                    localStorage.setItem('users', JSON.stringify(users));
                });
            });
        }

        // 更新关注状态
        function updateFollowStatus() {
            if (!currentUser) return;
            
            const userFollowing = users[currentUser.email].following || [];
            
            document.querySelectorAll('.follow-author').forEach(button => {
                const authorId = parseInt(button.getAttribute('data-id'));
                
                if (userFollowing.includes(authorId)) {
                    button.textContent = '已关注';
                    button.classList.remove('border', 'border-secondary', 'text-secondary');
                    button.classList.add('bg-secondary', 'text-white');
                } else {
                    button.textContent = '关注作者';
                    button.classList.remove('bg-secondary', 'text-white');
                    button.classList.add('border', 'border-secondary', 'text-secondary');
                }
            });
        }

        // 初始化订阅功能
        function initSubscription() {
            const subscriptionForm = document.getElementById('subscription-form');
            const subscriptionEmail = document.getElementById('subscription-email');
            const subscriptionSuccess = document.getElementById('subscription-success');
            
            subscriptionForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const email = subscriptionEmail.value.trim();
                
                if (!email) {
                    alert('请输入您的邮箱地址');
                    return;
                }
                
                // 模拟订阅成功
                subscriptionEmail.value = '';
                subscriptionSuccess.classList.remove('hidden');
                
                // 3秒后隐藏成功消息
                setTimeout(() => {
                    subscriptionSuccess.classList.add('hidden');
                }, 3000);
            });
        }
</script>

</body>
</html>
